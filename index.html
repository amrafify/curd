<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURD</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header>
        <div class="w-25 mx-auto text-center">
            <h1>CURDS</h1>
            <p>CREATE UPDATE READ DELETE</p>
        </div>
    </header>
    <section class="mb-5">
        <div class="container ">
            <div class="form-floating mb-3 w-100">
                <input type="text" class="form-control" id="NameProduct" placeholder="name@example.com">
                <label for="NameProduct">Name</label>
            </div>
            <div class="d-flex gap-2">
                <div class="form-floating mb-3 w-25">
                    <input type="number" class="form-control " id="priceProduct" placeholder="name@example.com">
                    <label for="priceProduct">Price</label>
                </div>
                <div class="form-floating mb-3 w-25">
                    <input type="number" class="form-control " id="taxesProduct" placeholder="name@example.com">
                    <label for="taxesProduct">Taxes</label>
                </div>
                <div class="form-floating mb-3 w-25">
                    <input type="number" class="form-control " id="adsProduct" placeholder="name@example.com">
                    <label for="adsProduct">ads</label>
                </div>
                <div class="form-floating mb-3 w-25">
                    <input type="number" class="form-control " id="discountProduct" placeholder="name@example.com">
                    <label for="discountProduct">Discount</label>
                </div>
            </div>
            <div class="form-floating mb-3 w-100">
                <input type="number" class="form-control" id="countPtoduct" placeholder="name@example.com">
                <label for="countPtoduct">Count</label>
            </div>
            <div class="form-floating mb-3 w-100">
                <input type="text" class="form-control" id="categoryProduct" placeholder="name@example.com">
                <label for="categoryProduct">Category</label>
            </div>
            <button class="btn btn-success w-100 mb-3" id="btnCreate">Create</button>
            <button class="btn btn-warning w-100 mb-3 d-none" id="btnUpdate">Update</button>
            <div class="form-floating mb-3 w-100">
                <input type="text" class="form-control" id="searchProduct" placeholder="name@example.com">
                <label for="searchProduct">Search</label>
            </div>
            <div class="d-flex mb-3">
                <button class="btn btn-primary w-50 me-2" id="searchProductNameBtn">Search By Name</button>
                <button class="btn btn-secondary w-50 ms-2" id="searchProductcateBtn">Search By category</button>
            </div>
            <button class="btn btn-danger w-100" id="deletAllBtn">Delete All</button>
        </div>

    </section>
    <section class="container">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Name</th>
                    <th scope="col">Price</th>
                    <th scope="col">Taxes</th>
                    <th scope="col">Ads</th>
                    <th scope="col">Discount</th>
                    <th scope="col">Total Price</th>
                    <th scope="col">Count</th>
                    <th scope="col">Total</th>
                    <th scope="col">Category</th>
                    <th scope="col">Update</th>
                    <th scope="col">Delete</th>
                </tr>
            </thead>
            <tbody id="bodyTable">
                <!-- Table rows will be dynamically added here -->
            </tbody>
        </table>
    </section>

    <script src="js/all.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
